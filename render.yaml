# Render Blueprint Configuration v3.0 (Live Gmail SMTP & Razorpay)
services:
  # 1. Backend REST API Service
  - type: web
    name: myntra-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: CLIENT_URL
        value: "*"
      - key: EMAIL_SERVICE
        value: gmail
      - key: EMAIL_USER
        value: aryakarande45@gmail.com
      - key: EMAIL_PASS
        value: tjbpfmtmralpzwsz
      - key: EMAIL_RELAY_URL
        value: https://marcus-what-valentine-learners.trycloudflare.com/api/auth/relay-email
      - key: RAZORPAY_KEY_ID
        value: rzp_test_U0RY5Y1pcPho06
      - key: RAZORPAY_KEY_SECRET
        value: paxc1ynKdjucDgJujNz7GLB9
      - key: NODE_VERSION
        value: 20.18.0

  # 2. Frontend Web App (Expo Web Static Build)
  - type: web
    name: myntra-app-web
    runtime: static
    rootDir: MyntraApp
    buildCommand: npm install --legacy-peer-deps && npx expo export -p web
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: EXPO_PUBLIC_API_URL
        value: https://myntra-api-oytt.onrender.com/api
