services:
  # 1. Backend REST API Service
  - type: web
    name: myntra-api
    env: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: CLIENT_URL
        value: "*"

  # 2. Frontend Web App (Expo Web Static Build)
  - type: static
    name: myntra-app-web
    rootDir: MyntraApp
    plan: free
    buildCommand: npm install && npx expo export -p web
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: EXPO_PUBLIC_API_URL
        value: https://myntra-api.onrender.com/api
