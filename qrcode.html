<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <title>Expo Go QR Scanner - Myntra App</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f4f7;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      color: #282c3f;
    }
    .card {
      background: white;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      text-align: center;
      max-width: 380px;
    }
    h2 {
      margin: 0 0 8px 0;
      color: #ff3f6c;
      font-size: 22px;
    }
    p {
      color: #535766;
      font-size: 14px;
      margin: 0 0 20px 0;
    }
    .qr-box {
      background: white;
      padding: 12px;
      border-radius: 12px;
      border: 2px dashed #ff3f6c;
      display: inline-block;
      margin-bottom: 20px;
    }
    .url {
      background: #fff0f3;
      padding: 10px 14px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 13px;
      color: #ff3f6c;
      word-break: break-all;
    }
    .tip {
      font-size: 12px;
      color: #94969f;
      margin-top: 14px;
    }
  </style>
</head>
